<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Eco Administração — Ecoplan</title>
<meta name="theme-color" content="#1B1D22" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Schibsted+Grotesk:wght@500;600;700;800&family=Newsreader:ital,opsz,wght@1,18..72,400;1,18..72,500&display=swap" rel="stylesheet" />
<script>
try{var _t=localStorage.getItem('ecoplan-theme');if(_t){document.documentElement.setAttribute('data-theme',_t);}else if(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches){document.documentElement.setAttribute('data-theme','dark');}}catch(e){}
</script>
<style>
:root{
  --bg:#FBFAF8;--surface:#FFFFFF;--surface-2:#F5F3EF;
  --ink:#16181D;--ink-soft:#494E58;--muted:#878D98;
  --line:#E8E5DF;--line-soft:#F0EDE7;
  --orange:#E8590C;--orange-deep:#C84A08;--orange-tint:#FCEFE6;
  --graphite:#1A1C21;--graphite-2:#24272E;--graphite-line:rgba(255,255,255,.10);
  --shadow-sm:0 1px 2px rgba(20,22,28,.04),0 2px 8px rgba(20,22,28,.05);
  --shadow-md:0 4px 12px rgba(20,22,28,.06),0 16px 40px rgba(20,22,28,.08);
  --shadow-lg:0 8px 24px rgba(20,22,28,.08),0 30px 70px rgba(20,22,28,.12);
  --r-sm:10px;--r-md:16px;--r-lg:24px;--r-xl:32px;
  --maxw:1200px;--pad:clamp(20px,5vw,64px);
  --sans:'Hanken Grotesk',-apple-system,sans-serif;
  --display:'Schibsted Grotesk','Hanken Grotesk',sans-serif;
  --serif:'Newsreader',Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.6;font-size:16px;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none}
h1,h2,h3,h4{font-family:var(--display);font-weight:700;line-height:1.08;letter-spacing:-.02em;color:var(--ink)}
::selection{background:var(--orange);color:#fff}
:focus-visible{outline:2.5px solid var(--orange);outline-offset:3px;border-radius:4px}
.wrap{max-width:var(--maxw);margin:0 auto;padding-left:var(--pad);padding-right:var(--pad)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font-family:var(--display);font-weight:600;font-size:15px;padding:13px 24px;border-radius:999px;transition:transform .25s cubic-bezier(.2,.7,.3,1),box-shadow .25s,background .25s,color .25s;white-space:nowrap;cursor:pointer}
.btn-primary{background:var(--orange);color:#fff;box-shadow:0 6px 18px rgba(232,89,12,.28);border:none}
.btn-primary:hover{background:var(--orange-deep);transform:translateY(-2px)}
.btn-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn-ghost:hover{border-color:var(--ink);transform:translateY(-2px)}

/* HEADER */
.header{position:sticky;top:0;z-index:1000;transition:background .3s,border-color .3s;border-bottom:1px solid transparent}
.header.scrolled{background:rgba(251,250,248,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom-color:var(--line)}
.nav{display:flex;align-items:center;gap:24px;height:78px}
.brand{display:flex;align-items:center;flex-shrink:0}
.admin-badge{font-family:var(--display);font-size:13px;font-weight:700;color:var(--orange);background:var(--orange-tint);padding:5px 14px;border-radius:999px;letter-spacing:.04em}
.nav-cta{display:flex;align-items:center;gap:12px;margin-left:auto}
.nav-cta .btn{padding:10px 18px;font-size:13.5px}
.theme-toggle{width:40px;height:40px;border-radius:10px;flex-shrink:0;border:1.5px solid var(--line);background:transparent;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);transition:border-color .2s,color .2s}
.theme-toggle:hover{border-color:var(--ink);color:var(--ink)}
.theme-toggle .icon-sun{display:none}.theme-toggle .icon-moon{display:block}
[data-theme="dark"] .theme-toggle .icon-sun{display:block}[data-theme="dark"] .theme-toggle .icon-moon{display:none}
[data-theme="dark"]{--bg:#0F1014;--surface:#1A1C22;--surface-2:#22252D;--ink:#F0EDE8;--ink-soft:#9BA2B0;--muted:#60656F;--line:#2A2D36;--line-soft:#1E2128;--orange-tint:rgba(232,89,12,.14);--shadow-sm:0 1px 2px rgba(0,0,0,.3),0 2px 8px rgba(0,0,0,.35);--shadow-md:0 4px 12px rgba(0,0,0,.3),0 16px 40px rgba(0,0,0,.4);--shadow-lg:0 8px 24px rgba(0,0,0,.35),0 30px 70px rgba(0,0,0,.5)}
[data-theme="dark"] .header.scrolled{background:rgba(12,13,16,.88)}

/* GATE */
.gate-page{min-height:100vh;background:linear-gradient(160deg,#000000,#000000);display:flex;align-items:center;justify-content:center;padding:24px;position:fixed;inset:0;z-index:2000}
.gate-page::before{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(255,255,255,.025) 1px,transparent 1px);background-size:36px 36px;pointer-events:none}
.gate-card{background:var(--surface);border-radius:var(--r-xl);padding:clamp(36px,5vw,52px);max-width:420px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,.3);position:relative;z-index:1;border:1px solid var(--line)}
.gate-logo{height:34px;margin-bottom:28px}
.gate-title{font-size:22px;font-weight:800;margin-bottom:6px}
.gate-sub{font-size:14px;color:var(--ink-soft);margin-bottom:32px}
.gate-error{font-size:13px;color:#D93025;min-height:18px;margin-top:8px;font-weight:500}
.form-label{display:block;font-family:var(--display);font-size:13px;font-weight:600;color:var(--ink);margin-bottom:7px}
.req{color:var(--orange)}.opt{font-size:11px;font-weight:500;color:var(--muted)}
.form-group{margin-bottom:18px}
.form-input{width:100%;padding:13px 16px;border:1.5px solid var(--line);border-radius:var(--r-md);font-family:var(--sans);font-size:15px;color:var(--ink);background:var(--surface);transition:border-color .2s,box-shadow .2s;outline:none}
.form-input:focus{border-color:var(--orange);box-shadow:0 0 0 3px var(--orange-tint)}
.form-input::placeholder{color:var(--muted)}
.pw-wrap{position:relative}
.pw-wrap .form-input{padding-right:46px}
.pw-eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--muted);padding:4px;display:flex}
.pw-eye:hover{color:var(--ink)}

/* ADMIN PANEL */
#adminPanel{display:none}
.admin-body{background:var(--surface-2);min-height:calc(100vh - 78px)}
.admin-layout{display:grid;grid-template-columns:420px 1fr;gap:32px;padding-top:40px;padding-bottom:72px;align-items:start}
.admin-card{background:var(--surface);border-radius:var(--r-xl);padding:32px;box-shadow:var(--shadow-sm);border:1px solid var(--line);position:sticky;top:98px}
.admin-card h2{font-size:18px;margin-bottom:4px}
.admin-form-sub{font-size:13px;color:var(--ink-soft);margin-bottom:24px}

/* Image upload */
.img-upload{border:2px dashed var(--line);border-radius:var(--r-md);cursor:pointer;overflow:hidden;transition:border-color .2s,background .2s;position:relative}
.img-upload:hover{border-color:var(--orange);background:var(--orange-tint)}
.img-placeholder{padding:24px 16px;text-align:center;pointer-events:none}
.img-placeholder svg{margin:0 auto 10px;color:var(--muted)}
.img-placeholder p{font-size:14px;color:var(--ink-soft);margin-bottom:4px}
.img-placeholder small{font-size:11.5px;color:var(--muted)}
.img-upload input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.img-upload.has-img{border-style:solid;border-color:var(--orange)}
.img-upload.has-img .img-placeholder{display:none}
#imgPreview{width:100%;height:160px;object-fit:cover;display:none}
.img-clear-btn{margin-top:6px;font-size:12.5px;color:var(--muted);cursor:pointer;display:none;background:none;border:none;padding:0}
.img-clear-btn:hover{color:#D93025}

/* File input */
.file-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.file-label-btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;border:1.5px solid var(--line);font-family:var(--display);font-size:13px;font-weight:600;color:var(--ink-soft);cursor:pointer;transition:border-color .2s,color .2s;white-space:nowrap}
.file-label-btn:hover{border-color:var(--ink);color:var(--ink)}
.file-name-txt{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.file-x{background:none;border:none;cursor:pointer;color:var(--muted);font-size:16px;line-height:1;display:none;flex-shrink:0}
.file-x:hover{color:#D93025}
textarea.form-input{resize:vertical;min-height:88px;line-height:1.5}
.form-actions{margin-top:24px}

/* Admin article list */
.admin-list-head{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.admin-list-head h2{font-size:18px}
.count-pill{background:var(--orange-tint);color:var(--orange);font-family:var(--display);font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px}
.admin-empty{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:36px;text-align:center;color:var(--muted);font-size:14px;line-height:1.7}
.admin-art-list{display:flex;flex-direction:column;gap:10px}
.admin-art-item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;display:flex;align-items:stretch;transition:box-shadow .2s}
.admin-art-item:hover{box-shadow:var(--shadow-sm)}
.admin-art-thumb{width:68px;height:68px;object-fit:cover;flex-shrink:0}
.admin-art-body{flex:1;padding:10px 14px;min-width:0;display:flex;flex-direction:column;justify-content:center}
.admin-art-title{font-family:var(--display);font-size:13.5px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:5px}
.admin-art-meta{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.subj-tag{font-family:var(--display);font-size:10.5px;font-weight:600;background:var(--orange-tint);color:var(--orange);padding:2px 8px;border-radius:999px}
.art-date-txt{font-size:11.5px;color:var(--muted)}
.admin-art-del{width:44px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--muted);border-left:1px solid var(--line);transition:background .2s,color .2s;cursor:pointer;background:none;border-top:none;border-right:none;border-bottom:none}
.admin-art-del:hover{background:#FEF2F2;color:#D93025}

/* Toast */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--graphite);color:#fff;padding:13px 24px;border-radius:999px;font-family:var(--display);font-size:14px;font-weight:600;box-shadow:var(--shadow-lg);transition:transform .35s cubic-bezier(.2,.7,.3,1),opacity .35s;opacity:0;z-index:9999;white-space:nowrap;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
[data-theme="dark"] .toast{background:#F0EDE8;color:#16181D}

@media(max-width:860px){
  .admin-layout{grid-template-columns:1fr}
  .admin-card{position:static}
}
@media(max-width:600px){
  .admin-badge{display:none}
}
</style>
</head>
<body>

<!-- GATE -->
<div id="gateScreen" class="gate-page">
  <div class="gate-card">
    <img src="assets/logo/Logo_Ecoplan.png" alt="Ecoplan" class="gate-logo" id="gateLogo" />
    <h1 class="gate-title">Eco Administração</h1>
    <p class="gate-sub">Acesso restrito a colaboradores Ecoplan.</p>
    <div class="form-group">
      <label class="form-label" for="pwInput">Senha de acesso</label>
      <div class="pw-wrap">
        <input type="password" id="pwInput" class="form-input" placeholder="••••••••" autocomplete="current-password" />
        <button type="button" class="pw-eye" id="pwEye" aria-label="Mostrar senha">
          <svg id="eyeShow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg id="eyeHide" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>
      </div>
      <div class="gate-error" id="gateError"></div>
    </div>
    <button class="btn btn-primary" id="loginBtn" style="width:100%">Entrar</button>
  </div>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel">
  <header class="header" id="adminHeader">
    <nav class="nav wrap">
      <a class="brand" href="area-do-cliente.html">
        <img id="brandLogo" src="assets/logo/Logo_Ecoplan.png" alt="Ecoplan" height="34" />
      </a>
      <span class="admin-badge">Eco Administração</span>
      <div class="nav-cta">
        <a href="eco-cliente.html" class="btn btn-ghost" target="_blank">Ver Eco Cliente</a>
        <button class="theme-toggle" id="themeToggle" aria-label="Alternar tema">
          <svg class="icon-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          <svg class="icon-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
        </button>
        <button class="btn btn-ghost" id="logoutBtn" style="color:var(--muted)">Sair</button>
      </div>
    </nav>
  </header>

  <div class="admin-body">
    <div class="wrap admin-layout">

      <!-- FORM -->
      <div class="admin-card">
        <h2>Novo Artigo</h2>
        <p class="admin-form-sub">Campos com <span style="color:var(--orange)">*</span> são obrigatórios.</p>
        <form id="articleForm" novalidate>

          <div class="form-group">
            <label class="form-label">Imagem <span class="req">*</span></label>
            <div class="img-upload" id="imgUpload">
              <input type="file" id="imageInput" accept="image/*" tabindex="-1" />
              <div class="img-placeholder" id="imgPlaceholder">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                <p>Clique para selecionar</p>
                <small>JPG, PNG, WEBP</small>
              </div>
              <img id="imgPreview" alt="Preview" />
            </div>
            <button type="button" class="img-clear-btn" id="imgClearBtn">× Remover imagem</button>
          </div>

          <div class="form-group">
            <label class="form-label" for="titleInput">Título / Descrição <span class="req">*</span></label>
            <input type="text" id="titleInput" class="form-input" placeholder="Título do artigo..." />
          </div>

          <div class="form-group">
            <label class="form-label" for="subjectInput">Assunto <span class="req">*</span></label>
            <input type="text" id="subjectInput" class="form-input" placeholder="Ex: Legislação, Comunicado, Contabilidade..." />
          </div>

          <div class="form-group">
            <label class="form-label" for="dateInput">Data <span class="req">*</span></label>
            <input type="date" id="dateInput" class="form-input" />
          </div>

          <div class="form-group">
            <label class="form-label">Arquivo <span class="opt">opcional</span></label>
            <div class="file-row">
              <label class="file-label-btn" for="fileInput">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
                Selecionar arquivo
              </label>
              <input type="file" id="fileInput" style="display:none" />
              <span class="file-name-txt" id="fileNameTxt">Nenhum arquivo</span>
              <button type="button" class="file-x" id="fileXBtn">×</button>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="linkInput">Link <span class="opt">opcional</span></label>
            <input type="url" id="linkInput" class="form-input" placeholder="https://..." />
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary" style="width:100%">
              Publicar Artigo
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </button>
          </div>
        </form>
      </div>

      <!-- LIST -->
      <div>
        <div class="admin-list-head">
          <h2>Artigos Publicados</h2>
          <span class="count-pill" id="countPill">0</span>
        </div>
        <div class="admin-empty" id="emptyState">
          Nenhum artigo publicado ainda.<br>Crie o primeiro artigo ao lado.
        </div>
        <div class="admin-art-list" id="adminArtList"></div>
      </div>

    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var STORAGE_KEY = 'ecoplan-artigos';

/* --- THEME --- */
var brandLogo = document.getElementById('brandLogo');
var gateLogo  = document.getElementById('gateLogo');
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  var s = t === 'dark' ? "assets/logo/Logo_Ecoplan_Dark.png" : "assets/logo/Logo_Ecoplan.png";
  if (brandLogo) brandLogo.src = s;
  if (gateLogo)  gateLogo.src  = s;
}
var st = localStorage.getItem('ecoplan-theme');
if (st) applyTheme(st);
document.querySelectorAll('.theme-toggle').forEach(function(b) {
  b.addEventListener('click', function() {
    var n = (document.documentElement.getAttribute('data-theme') || 'light') === 'dark' ? 'light' : 'dark';
    applyTheme(n); localStorage.setItem('ecoplan-theme', n);
  });
});

/* --- AUTH --- */
var ADMIN_PW = 'ecoplan';
function checkAuth() {
  if (sessionStorage.getItem('eco-adm') === '1') showPanel();
}
function showPanel() {
  document.getElementById('gateScreen').style.display = 'none';
  document.getElementById('adminPanel').style.display = 'block';
  loadArticles();
}
document.getElementById('loginBtn').addEventListener('click', doLogin);
document.getElementById('pwInput').addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin(); });
function doLogin() {
  var pw = document.getElementById('pwInput').value;
  var err = document.getElementById('gateError');
  if (pw === ADMIN_PW) {
    sessionStorage.setItem('eco-adm','1');
    err.textContent = '';
    showPanel();
  } else {
    err.textContent = 'Senha incorreta.';
    document.getElementById('pwInput').select();
  }
}
document.getElementById('pwEye').addEventListener('click', function() {
  var inp = document.getElementById('pwInput');
  var show = inp.type === 'password';
  inp.type = show ? 'text' : 'password';
  document.getElementById('eyeShow').style.display = show ? 'none' : '';
  document.getElementById('eyeHide').style.display = show ? '' : 'none';
});
document.getElementById('logoutBtn').addEventListener('click', function() {
  sessionStorage.removeItem('eco-adm');
  document.getElementById('adminPanel').style.display = 'none';
  document.getElementById('gateScreen').style.display = 'flex';
  document.getElementById('pwInput').value = '';
  document.getElementById('gateError').textContent = '';
});

/* --- IMAGE UPLOAD --- */
var curImg = null;
var imgUploadEl   = document.getElementById('imgUpload');
var imgInputEl    = document.getElementById('imageInput');
var imgPreviewEl  = document.getElementById('imgPreview');
var imgPlacEl     = document.getElementById('imgPlaceholder');
var imgClearBtn   = document.getElementById('imgClearBtn');

imgInputEl.addEventListener('change', function() {
  var f = this.files[0]; if (!f) return;
  compressImage(f, 1200, 900, 0.82, function(data) {
    curImg = data;
    imgPreviewEl.src = data;
    imgPreviewEl.style.display = 'block';
    imgPlacEl.style.display = 'none';
    imgUploadEl.classList.add('has-img');
    imgClearBtn.style.display = 'inline';
  });
});
imgClearBtn.addEventListener('click', function() {
  curImg = null;
  imgPreviewEl.src = ''; imgPreviewEl.style.display = 'none';
  imgPlacEl.style.display = 'block';
  imgUploadEl.classList.remove('has-img');
  imgClearBtn.style.display = 'none';
  imgInputEl.value = '';
});
function compressImage(file, mw, mh, q, cb) {
  var r = new FileReader();
  r.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      var ratio = Math.min(mw / img.width, mh / img.height, 1);
      var c = document.createElement('canvas');
      c.width = Math.round(img.width * ratio);
      c.height = Math.round(img.height * ratio);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      cb(c.toDataURL('image/jpeg', q));
    };
    img.src = e.target.result;
  };
  r.readAsDataURL(file);
}

/* --- FILE UPLOAD --- */
var curFile = null; var curFileName = null;
var fileInputEl  = document.getElementById('fileInput');
var fileNameTxt  = document.getElementById('fileNameTxt');
var fileXBtn     = document.getElementById('fileXBtn');

fileInputEl.addEventListener('change', function() {
  var f = this.files[0]; if (!f) return;
  var fr = new FileReader();
  fr.onload = function(e) {
    curFile = e.target.result; curFileName = f.name;
    fileNameTxt.textContent = f.name;
    fileXBtn.style.display = 'inline';
  };
  fr.readAsDataURL(f);
});
fileXBtn.addEventListener('click', function() {
  curFile = null; curFileName = null;
  fileNameTxt.textContent = 'Nenhum arquivo';
  fileXBtn.style.display = 'none';
  fileInputEl.value = '';
});

/* --- FORM SUBMIT --- */
document.getElementById('articleForm').addEventListener('submit', function(e) {
  e.preventDefault();
  var title   = document.getElementById('titleInput').value.trim();
  var subject = document.getElementById('subjectInput').value.trim();
  var date    = document.getElementById('dateInput').value;
  var link    = document.getElementById('linkInput').value.trim();
  if (!curImg)   { showToast('Selecione uma imagem.'); return; }
  if (!title)    { showToast('Informe o título do artigo.'); return; }
  if (!subject)  { showToast('Informe o assunto do artigo.'); return; }
  if (!date)     { showToast('Informe a data do artigo.'); return; }
  var art = { id: String(Date.now()), title: title, subject: subject, date: date,
    image: curImg, file: curFile, fileName: curFileName, link: link || null };
  var arts = getArticles(); arts.unshift(art);
  try {
    saveArticles(arts);
    resetForm(); loadArticles(); showToast('Artigo publicado!');
  } catch(ex) {
    showToast('Armazenamento cheio. Use imagens menores ou remova artigos antigos.');
  }
});
function resetForm() {
  document.getElementById('titleInput').value = '';
  document.getElementById('subjectInput').value = '';
  document.getElementById('dateInput').value = '';
  document.getElementById('linkInput').value = '';
  imgClearBtn.click(); fileXBtn.click();
}

/* --- ARTICLE CRUD --- */
function getArticles() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch(e) { return []; } }
function saveArticles(a) { localStorage.setItem(STORAGE_KEY, JSON.stringify(a)); }
function loadArticles() {
  var arts = getArticles();
  document.getElementById('countPill').textContent = arts.length;
  var list = document.getElementById('adminArtList');
  var empty = document.getElementById('emptyState');
  if (arts.length === 0) { empty.style.display = 'block'; list.innerHTML = ''; return; }
  empty.style.display = 'none';
  list.innerHTML = arts.map(function(a) {
    return '<div class="admin-art-item">' +
      '<img class="admin-art-thumb" src="'+a.image+'" alt="" />' +
      '<div class="admin-art-body">' +
        '<span class="admin-art-title">'+esc(a.title)+'</span>' +
        '<div class="admin-art-meta">' +
          '<span class="subj-tag">'+esc(a.subject)+'</span>' +
          '<span class="art-date-txt">'+fmtDate(a.date)+'</span>' +
        '</div>' +
      '</div>' +
      '<button class="admin-art-del" data-id="'+a.id+'" title="Excluir">' +
        '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>' +
      '</button></div>';
  }).join('');
  list.querySelectorAll('.admin-art-del').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var id = this.getAttribute('data-id');
      if (!confirm('Excluir este artigo permanentemente?')) return;
      saveArticles(getArticles().filter(function(a){ return a.id !== id; }));
      loadArticles(); showToast('Artigo excluído.');
    });
  });
}

/* --- UTILS --- */
function fmtDate(s) {
  try { var d = new Date(s+'T12:00:00'); return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'numeric'}); }
  catch(e){ return s; }
}
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
var _toastTimer;
function showToast(msg) {
  var t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(_toastTimer); _toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 3200);
}

/* --- HEADER SCROLL --- */
var adminHeader = document.getElementById('adminHeader');
window.addEventListener('scroll', function(){ if(adminHeader) adminHeader.classList.toggle('scrolled', window.scrollY > 10); }, {passive:true});

checkAuth();
</script>
